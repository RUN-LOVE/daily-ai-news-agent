spring:
  application:
    name: daily-ai-news-agent
  config:
    import: optional:file:.env[.properties]
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}

app:
  workspace: ${APP_WORKSPACE:workspace}
  db-path: ${APP_DB_PATH:data/news-agent.db}
